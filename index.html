    --panel: #15171e;
    --panel-2: #1d2029;
    --border: #2e3140;
    --grid-line: #262a36;
    --text: #eceae2;

    --tier-b: #4a90d9;

    --panel: #ffffff;
    --panel-2: #eceae2;
    --border: #d5d2c6;
    --grid-line: #ddd9cc;

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    max-width: 100%;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }
  .num { font-family: "SF Mono", "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-variant-numeric: tabular-nums; }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    display: flex; align-items: flex-start; justify-content: space-between;
  }

    margin: 0;
    font-family: "ESN Cinzel", "Times New Roman", Georgia, "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-weight: 700;

    color: var(--text-dim);
    text-transform: lowercase;
  }

    letter-spacing: 0.04em;

<body>
<header>
  <div>
    <h1 aria-label="Elder Sign's Note"><span class="brand" aria-hidden="true"><b>E</b>lder <b>S</b>ign<i>'s</i> <b>N</b>ote</span><span class="series">A Dark Chamber for Recording Sin &quot;J&quot;</span></h1>
    <p class="live-from" id="live-from"></p>
  </div>
  <button id="theme-toggle" aria-label="テーマ切替">◐</button>
</header>
<main>
  <div id="app"><div class="loading">シャドー台帳集計中…</div></div>
</main>
<script>
  // ===== テーマ切替 =====
  (function () {
    if (typeof document === "undefined") return;
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    btn.addEventListener("click", function () {
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  })();

  // ===== 集計ロジック（node からも同一関数を呼べるよう純関数化） =====
  var LedgerAgg = (function () {
    // 台帳の開始日（稼働日）。YYYY-MM-DD。空文字のあいだは「稼働前」として何も集計しない。
    var LIVE_FROM = "2026-10-16";
    // 新8点買い目（s1-s2-s3 等）での記録に切り替わった日。これより前は旧買い目(o1頭中心)で記録されている（10/19分は切替前に取得済みのため旧買い目のまま）。
    var NEW8_FROM = "2026-10-20";

    var TIERS = ["A", "B", "C"];
    var GRADES = ["s-kyu", "a-kyu", "a-chal", "girls"];
    var GRADE_LABEL = { "s-kyu": "S級", "a-kyu": "A級", "a-chal": "A級チャレンジ", "girls": "ガールズ" };
    var WIND_BANDS = ["<1.5", "1.5-3", "3+"];
    var LABELS = ["s1", "s2", "s3", "L"];
    // 新8点の固定定義（ラベル→labelToCarで車番化して精算する。記録済みticketsは使わない）
    var NEW8_TICKETS = [
      { key: "s1-s2-s3", type: "sanrentan", labs: ["s1", "s2", "s3"] },
      { key: "s1-s2-L", type: "sanrentan", labs: ["s1", "s2", "L"] },
      { key: "s2-s1-s3", type: "sanrentan", labs: ["s2", "s1", "s3"] },
      { key: "s1-s3-s2", type: "sanrentan", labs: ["s1", "s3", "s2"] },
      { key: "s1-L-s2", type: "sanrentan", labs: ["s1", "L", "s2"] },
      { key: "s1-L-s3", type: "sanrentan", labs: ["s1", "L", "s3"] },
      { key: "s2-s1", type: "nisyatan", labs: ["s2", "s1"] },
      { key: "s2-s3", type: "nisyatan", labs: ["s2", "s3"] }
    ];

    // 有効行: 予想（tier/tickets）があり、着順と二車単・三連単の払戻が確定している行
    function validRows(records) {
      var out = [];
      for (var i = 0; i < records.length; i++) {
        var o = records[i];
        if (!o || o.skipped || TIERS.indexOf(o.tier) === -1 || !Array.isArray(o.tickets) || o.tickets.length === 0) continue;
        if (!Array.isArray(o.finish) || o.finish.length < 3) continue;
        if (!o.payouts || typeof o.payouts.sanrentan !== "number" || typeof o.payouts.nisyatan !== "number") continue;
        out.push(o);
      }
      return out;
    }

    // labelToCar から新8点の tickets（NEW8_TICKETS基準・順序固定）を組み立てる。
    // s1/s2/s3/L のいずれかが数値で無ければ再精算不能として null を返す。
    function ticketsFromLabelToCar(lc) {
      lc = lc || {};
      var req = ["s1", "s2", "s3", "L"];
      for (var i = 0; i < req.length; i++) {
        if (typeof lc[req[i]] !== "number") return null;
      }
      return NEW8_TICKETS.map(function (t) {
        return { type: t.type, cars: t.labs.map(function (l) { return lc[l]; }) };
      });
    }

    // 1件を新8点で再精算用に組み直す。null = 再精算不能（除外）。
    function retroTickets(o) {
      return ticketsFromLabelToCar(o && o.labelToCar);
    }

    // 台帳データは書き換えず、全行を新8点で組み直したコピーを返す。
    // retro: NEW8_FROM より前の日付（後付け当てはめ）。ticketsRecorded: 記録時点の旧tickets。
    // labelToCarにs1/s2/s3/Lが揃わない行は再精算不能として除外（skippedCount でカウント）。
    function recomputedRows(records, skippedCounter) {
      var out = [];
      for (var i = 0; i < records.length; i++) {
        var o = records[i];
        if (!o || o.skipped || TIERS.indexOf(o.tier) === -1) continue;
        if (!Array.isArray(o.finish) || o.finish.length < 3) continue;
        if (!o.payouts || typeof o.payouts.sanrentan !== "number" || typeof o.payouts.nisyatan !== "number") continue;
        var newTickets = retroTickets(o);
        if (!newTickets) { if (skippedCounter) skippedCounter.n++; continue; }
        var copy = {};
        for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) copy[k] = o[k]; }
        copy.ticketsRecorded = o.tickets;
        copy.tickets = newTickets;
        copy.retro = typeof o.date === "string" && o.date < NEW8_FROM;
        out.push(copy);
      }
      return out;
    }

    // 記録済みの hit_bets / stake / payout は使わず、着順・払戻・買い目から再計算する
    function settle(o) {
      var f = o.finish;
      var payout = 0, hits = 0;
      for (var i = 0; i < o.tickets.length; i++) {
        var t = o.tickets[i], c = t.cars;
        if (t.type === "sanrentan" && c[0] === f[0] && c[1] === f[1] && c[2] === f[2]) { hits++; payout += o.payouts.sanrentan; }
        else if (t.type === "nisyatan" && c[0] === f[0] && c[1] === f[1]) { hits++; payout += o.payouts.nisyatan; }
      }
      return { stake: o.tickets.length * 100, payout: payout, hit: hits > 0 };
    }

    // オッズ加味の精算: 確定オッズが必要倍率（1/的中確率）以上の買い目だけ買った場合。
    // ticket_probs / odds が無い・不備な行は null（除外）。買い目は type+cars で突き合わせる（添字では対応させない）。
    function findByTypeCars(list, type, cars) {
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e && e.type === type && Array.isArray(e.cars) && e.cars.length === cars.length) {
          var same = true;
          for (var j = 0; j < cars.length; j++) { if (e.cars[j] !== cars[j]) { same = false; break; } }
          if (same) return e;
        }
      }
      return null;
    }

    function settleOdds(o) {
      if (!Array.isArray(o.ticket_probs) || !Array.isArray(o.odds)) return null;
      var f = o.finish;
      var stake = 0, payout = 0, hits = 0, bought = 0;
      for (var i = 0; i < o.tickets.length; i++) {
        var t = o.tickets[i], c = t.cars;
        var pEntry = findByTypeCars(o.ticket_probs, t.type, c);
        var oEntry = findByTypeCars(o.odds, t.type, c);
        if (!pEntry || typeof pEntry.prob !== "number" || pEntry.prob <= 0) return null;
        if (!oEntry || typeof oEntry.odds !== "number") return null;
        if (oEntry.odds * pEntry.prob < 1) continue;
        bought++;
        stake += 100;
        if (t.type === "sanrentan" && c[0] === f[0] && c[1] === f[1] && c[2] === f[2]) { hits++; payout += o.payouts.sanrentan; }
        else if (t.type === "nisyatan" && c[0] === f[0] && c[1] === f[1]) { hits++; payout += o.payouts.nisyatan; }
      }
      return { stake: stake, payout: payout, hit: hits > 0, bought: bought };
    }

    // 買い目ごとの「買えたか」情報。ticket_probs/oddsが無い・不備な行はnull。
    // 非nullなら o.tickets と同じ順序・長さの配列で各要素 { bought, odds, need }（need=1/的中確率）。
    function boughtInfo(o) {
      if (!Array.isArray(o.ticket_probs) || !Array.isArray(o.odds)) return null;
      var out = [];
      for (var i = 0; i < o.tickets.length; i++) {
        var t = o.tickets[i], c = t.cars;
        var pEntry = findByTypeCars(o.ticket_probs, t.type, c);
        var oEntry = findByTypeCars(o.odds, t.type, c);
        if (!pEntry || typeof pEntry.prob !== "number" || pEntry.prob <= 0) return null;
        if (!oEntry || typeof oEntry.odds !== "number") return null;
        out.push({ bought: (oEntry.odds * pEntry.prob) >= 1, odds: oEntry.odds, need: 1 / pEntry.prob });
      }
      return out;
    }

    // バンク情報（周回長・直線長・カント角）。/root/oldjzirt/bankdata.json から場名キーを
    // 絵文字等を除去して生成した定数（生成スクリプト: スクラッチパッド gen_bank_consts.py）。

</script>
<script>
  // ===== データ取得 → 描画（ブラウザのみ） =====
  (function () {
    if (typeof document === "undefined") return;
    var BASE = "https://raw.githubusercontent.com/Jiz41/oldjzirt_log/shadow-data/data/shadow/";
    var A = LedgerAgg;
    var pct = A.pct;

    var STATE = { tab: "seiseki", mode: "all", records: [], skippedCount: 0, sortVenue: { col: "n", dir: -1 }, recFilter: { date: "", venue: "", grade: "", hit: "" } };

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
    function fmtPct(v) { return v.toFixed(1) + "%"; }
    function fmtYen(v) { return (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString("ja-JP"); }
    function recClass(v) { return v >= 100 ? "rec-pos" : "rec-neg"; }
    function tierTag(t) { return "<span class='tier-tag " + t + "'>" + t + "</span>"; }

    document.getElementById("live-from").textContent = A.LIVE_FROM ? ("台帳開始日（稼働日）: " + A.LIVE_FROM) : "台帳開始日（稼働日）: 稼働前";

    function monthList() {
      if (!A.LIVE_FROM) return [];
      var now = new Date();
      var cy = now.getFullYear(), cm = now.getMonth() + 1;
      var y = +A.LIVE_FROM.slice(0, 4), m = +A.LIVE_FROM.slice(5, 7);
      var list = [];
      while (y < cy || (y === cy && m <= cm)) {
        list.push(y + ("0" + m).slice(-2));
        m++; if (m > 12) { m = 1; y++; }
      }
      return list;
    }

    function parseJsonl(text) {
      var out = [];
      var lines = text.split("\n");
      for (var i = 0; i < lines.length; i++) {
        var l = lines[i].trim();
        if (!l) continue;
        try { out.push(JSON.parse(l)); } catch (e) { /* 壊れた行は飛ばす */ }
      }
      return out;
    }

    function fetchAll() {
      var records = [];
      var chain = Promise.resolve();
      monthList().forEach(function (mk) {
        chain = chain.then(function () {
          return fetch(BASE + mk + ".jsonl", { cache: "no-store" }).then(function (r) {
            if (r.status === 404) { return; }
            if (!r.ok) throw new Error("HTTP " + r.status + " (" + mk + ")");
            return r.text().then(function (t) { records = records.concat(parseJsonl(t)); });
          });
        });
      });
      return chain.then(function () { return records; });
    }

    // ===== タブ共通: フィルタバー ＋ タブバーの骨格 =====
    function shellHtml() {
      var html = "";
      html += "<p class='filter-note' style='width:auto'>〜" + esc(dateMinusOne(A.NEW8_FROM)) + "は新8点を後付けで当てはめた参考値、" + esc(A.NEW8_FROM) + "〜が初見です。" +
        (STATE.skippedCount > 0 ? "（再精算不能 " + STATE.skippedCount + "件は集計対象外）" : "") + "</p>";
      html += "<div class='filter-bar'>";
      [["all", "全買い"], ["odds", "オッズ加味"]].forEach(function (m) {
        html += "<button class='tab-btn mode-btn" + (STATE.mode === m[0] ? " active" : "") + "' data-mode='" + m[0] + "' style='border:1px solid var(--border);border-radius:4px'>" + m[1] + "</button>";
      });
      html += "<span class='filter-note' style='width:auto'>オッズ加味＝確定オッズ×的中確率≧1 の買い目だけ買った場合。買える買い目が0のレースは母数に含めない。</span>";
      html += "</div>";
      html += "<div class='tabbar' id='tabbar'>";
      [["seiseki", "成績"], ["venue", "場別・条件別"], ["kensho", "検証"], ["kiroku", "記録"]].forEach(function (t) {
        html += "<button class='tab-btn" + (STATE.tab === t[0] ? " active" : "") + "' data-tab='" + t[0] + "'>" + t[1] + "</button>";
      });
      html += "</div>";
      html += "<div class='tab-panel active' id='panel-seiseki'></div>";
      html += "<div class='tab-panel' id='panel-venue'></div>";
      html += "<div class='tab-panel' id='panel-kensho'></div>";
      html += "<div class='tab-panel' id='panel-kiroku'></div>";
      html += "<div class='note'>集計対象: 台帳開始日（稼働日）以降に毎晩自動取得したレース。台帳のデータは書き換えていません。〜" + esc(dateMinusOne(A.NEW8_FROM)) + "の成績は表示時に新8点へ当てはめた参考値です。<br>数値はシャドー台帳の自動集計による非公式値です。的中・回収は着順・払戻と新8点の買い目から再計算しており、記録済みの hit_bets / payout には依存していません。1レース最大800円（8点×100円）・実投票ではありません。</div>";
      return html;
    }

    function dateMinusOne(d) {
      var dt = new Date(d + "T00:00:00Z");
      dt.setUTCDate(dt.getUTCDate() - 1);
      return dt.toISOString().slice(0, 10);
    }

    // ===== タブ1: 成績 =====
    function summaryCardsHtml(agg, title, emptyMsg, aggE) {
      if (agg.n === 0 && emptyMsg) {
        return "<section><h2>" + esc(title) + "</h2><p class='subhead'>" + esc(emptyMsg) + "</p></section>";
      }
      var html = "<section><h2>" + esc(title) + "</h2><div class='summary'>";
      html += "<div class='stat'><div class='label'>的中率</div><div class='value num'>" + fmtPct(pct(agg.hits, agg.n)) + "</div><div class='sub'>" + agg.hits + " / " + agg.n + " レース的中</div></div>";
      html += "<div class='stat'><div class='label'>回収率</div><div class='value num " + recClass(pct(agg.payout, agg.stake)) + "'>" + fmtPct(pct(agg.payout, agg.stake)) + "</div><div class='sub'>" + fmtYen(agg.payout) + " / " + fmtYen(agg.stake) + "</div></div>";
      html += "<div class='stat'><div class='label'>投資</div><div class='value num'>" + fmtYen(agg.stake) + "</div><div class='sub'>1レース最大800円</div></div>";
      html += "<div class='stat'><div class='label'>損益</div><div class='value num " + recClass(pct(agg.payout, agg.stake)) + "'>" + fmtYen(agg.payout - agg.stake) + "</div><div class='sub'>払戻-投資</div></div>";
      if (aggE) {
        var j = A.judgeExp(aggE);
        if (j) {
          html += "<div class='stat'><div class='label'>想定回収率</div><div class='value num'>" + fmtPct(j.expRate) + "</div><div class='sub'>n=" + j.nE + "（ticket_probs/odds有行のみ）</div></div>";
          html += "<div class='stat'><div class='label'>判定</div><div class='value num'>" + esc(j.judge) + "</div><div class='sub'>z=" + j.z.toFixed(2) + "（近似・参考値）</div></div>";
          html += "<div class='stat'><div class='label'>精度差（logloss）</div><div class='value num'>" + j.diff.toFixed(3) + "</div><div class='sub'>正=モデルの方が市場より当たらない</div></div>";
        }
      }
      html += "</div></section>";
      return html;
    }

    // 「全買い vs オッズ加味」比較セクション。対象行は settleOdds が null でない行のみ（両列で同じ母集団）。
    function oddsComparisonHtml(rows) {
      var excluded = 0, skipped = 0;
      var aggAll = A.blank(), aggOdds = A.blank();
      rows.forEach(function (o) {
        var so = A.settleOdds(o);
        if (so === null) { excluded++; return; }
        A.accum(aggAll, A.settle(o));
        if (so.bought >= 1) {
          aggOdds.n++;
          aggOdds.stake += so.stake;
          aggOdds.payout += so.payout;
          if (so.hit) aggOdds.hits++;
        } else {
          skipped++;
        }
      });
      var colHtml = function (agg) {
        return "<table><tbody>" +
          "<tr><th>レース数</th><td class='num'>" + agg.n + "</td></tr>" +
          "<tr><th>投資額</th><td class='num'>" + fmtYen(agg.stake) + "</td></tr>" +
          "<tr><th>払戻</th><td class='num'>" + fmtYen(agg.payout) + "</td></tr>" +
          "<tr><th>損益</th><td class='num " + recClass(pct(agg.payout, agg.stake)) + "'>" + fmtYen(agg.payout - agg.stake) + "</td></tr>" +
          "<tr><th>的中率</th><td class='num'>" + fmtPct(pct(agg.hits, agg.n)) + "</td></tr>" +
          "<tr><th>回収率</th><td class='num " + recClass(pct(agg.payout, agg.stake)) + "'>" + fmtPct(pct(agg.payout, agg.stake)) + "</td></tr>" +
          "</tbody></table>";
      };
      var html = "<section><h2>全買い vs オッズ加味</h2><div class='table-scroll' style='display:flex;gap:12px;flex-wrap:wrap'>" +
        "<div style='flex:1;min-width:140px'><h3 style='margin:4px 0'>全買い</h3>" + colHtml(aggAll) + "</div>" +
        "<div style='flex:1;min-width:140px'><h3 style='margin:4px 0'>オッズ加味</h3>" + colHtml(aggOdds) + "</div>" +
        "</div><p class='subhead'>オッズ加味＝確定オッズが必要倍率（1÷的中確率）以上の買い目だけ買った場合。1点も買えないレースは母数に含めない（見送り" + skipped + "件）。ticket_probs/odds未取得の" + excluded + "件は両列から除外。確定オッズによる事後計算で参考値</p></section>";
      return html;
    }

    function renderSeiseki(rows) {
      var html = "";
      var mode = STATE.mode;
      var agg = A.blank(), aggShonen = A.blank(), aggAtozuke = A.blank(), aggE = A.blankE();
      rows.forEach(function (o) {
        var s = A.modeSettle(o, mode);
        if (!(mode === "odds" && (s === null || s.bought === 0))) {
          if (s !== null) {
            A.accum(agg, s);
            A.accum(o.retro ? aggAtozuke : aggShonen, s);
          }
        }
        var e = A.evalRow(o, mode);
        if (e !== null && !(mode === "odds" && e.bought === 0)) A.accumE(aggE, e);
      });
      html += summaryCardsHtml(agg, "通算（新8点・全期間・" + (mode === "odds" ? "オッズ加味" : "全買い") + "）", null, aggE);
      html += "<p class='subhead' style='margin:-4px 0 12px'>うち初見（" + esc(A.NEW8_FROM) + "〜）：" +
        (aggShonen.n === 0 ? "まだデータなし"
          : aggShonen.n + "レース・的中" + fmtPct(pct(aggShonen.hits, aggShonen.n)) + "・回収率" + fmtPct(pct(aggShonen.payout, aggShonen.stake)) + "（" + fmtYen(aggShonen.payout - aggShonen.stake) + "）") +
        "　／　後付け（〜" + esc(dateMinusOne(A.NEW8_FROM)) + "）は新8点を過去に当てはめた参考値</p>";

      html += oddsComparisonHtml(rows);

      html += "<section><h2>累計回収額の推移</h2><div class='chart-wrap'>" + cumulativeChartSvg(rows, mode) + "</div></section>";

      html += "<section><h2>日別損益カレンダー</h2>" + calendarHtml(rows, mode) + "</section>";

      var streaks = streakInfo(rows, mode);
      html += "<section><h2>連勝・連敗</h2><div class='table-scroll'><table><thead><tr><th>項目</th><th>値</th></tr></thead><tbody>";
      html += "<tr><td>最大連勝</td><td class='num'>" + streaks.maxWin + "</td></tr>";
      html += "<tr><td>最大連敗</td><td class='num'>" + streaks.maxLose + "</td></tr>";
      html += "<tr><td>現在の" + (streaks.curIsWin ? "連勝" : "連敗") + "</td><td class='num'>" + streaks.cur + "</td></tr>";
      html += "</tbody></table></div></section>";

      document.getElementById("panel-seiseki").innerHTML = html;
    }

    // mode="odds"は買える買い目が0の行（settleOdds null含む）を連勝連敗の判定から除外（飛ばす）。
    function streakInfo(rows, mode) {
      var sorted = rows.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      var maxWin = 0, maxLose = 0, curWin = 0, curLose = 0;
      sorted.forEach(function (o) {
        var s = A.modeSettle(o, mode);
        if (s === null) return;
        if (mode === "odds" && s.bought === 0) return;
        var hit = s.hit;
        if (hit) { curWin++; curLose = 0; if (curWin > maxWin) maxWin = curWin; }
        else { curLose++; curWin = 0; if (curLose > maxLose) maxLose = curLose; }
      });
      return { maxWin: maxWin, maxLose: maxLose, cur: curWin > 0 ? curWin : curLose, curIsWin: curWin > 0 };
    }

    function cumulativeChartSvg(rows, mode) {
      var series = A.cumulativeSeries(rows, mode);
      if (series.length === 0) return "<p class='subhead'>データがありません。</p>";
      var W = 600, H = 160, pad = 24;
      var vals = series.map(function (p) { return p.cum; });
      var minV = Math.min(0, Math.min.apply(null, vals));
      var maxV = Math.max(0, Math.max.apply(null, vals));
      if (minV === maxV) { minV -= 1; maxV += 1; }
      var n = series.length;
      function x(i) { return pad + (n === 1 ? 0 : (W - 2 * pad) * i / (n - 1)); }
      function y(v) { return H - pad - (H - 2 * pad) * (v - minV) / (maxV - minV); }
      var pts = series.map(function (p, i) { return x(i).toFixed(1) + "," + y(p.cum).toFixed(1); }).join(" ");
      var zeroY = y(0).toFixed(1);
      var last = series[series.length - 1].cum;
      var color = last >= 0 ? "var(--neon-a)" : "var(--accent)";
      var boundaryIdx = -1;
      for (var i = 0; i < n; i++) { if (series[i].date >= A.NEW8_FROM) { boundaryIdx = i; break; } }
      var boundaryHtml = "";
      if (boundaryIdx > 0) {
        var bx = x(boundaryIdx).toFixed(1);
        boundaryHtml = "<line x1='" + bx + "' y1='" + pad + "' x2='" + bx + "' y2='" + (H - pad) + "' stroke='var(--gold)' stroke-width='1' stroke-dasharray='3,3'/>" +
          "<text x='" + bx + "' y='" + (pad - 4 < 10 ? 10 : pad - 4) + "' font-size='9' fill='var(--gold)'>ここから初見</text>";
      }
      return "<svg viewBox='0 0 " + W + " " + H + "' width='100%' height='" + H + "' preserveAspectRatio='none'>" +
        "<line x1='" + pad + "' y1='" + zeroY + "' x2='" + (W - pad) + "' y2='" + zeroY + "' stroke='var(--grid-line)' stroke-width='1'/>" +
        boundaryHtml +
        "<polyline points='" + pts + "' fill='none' stroke='" + color + "' stroke-width='2'/>" +
        "<text x='" + pad + "' y='14' font-size='10' fill='var(--text-dim)'>" + esc(series[0].date) + "</text>" +
        "<text x='" + (W - pad) + "' y='14' font-size='10' fill='var(--text-dim)' text-anchor='end'>" + esc(series[series.length - 1].date) + "</text>" +
        "<text x='" + (W - pad) + "' y='" + (H - 4) + "' font-size='11' fill='" + color + "' text-anchor='end'>" + esc(fmtYen(last)) + "</text>" +
        "</svg>";
    }

    function calendarHtml(rows, mode) {
      var daily = A.dailyAgg(rows, mode).map;
      var dates = Object.keys(daily);
      if (!dates.length) return "<p class='subhead'>データがありません。</p>";
      var months = {};
      monthList().forEach(function (mk) { months[mk] = true; });
      var dow = ["日", "月", "火", "水", "木", "金", "土"];
      var html = "";
      Object.keys(months).sort().forEach(function (mk) {
        var y = +mk.slice(0, 4), m = +mk.slice(4, 6);
        var first = new Date(Date.UTC(y, m - 1, 1));
        var daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
        var startDow = first.getUTCDay();
        html += "<div class='cal-month'><h3>" + y + "年" + m + "月</h3><div class='cal-grid'>";
        dow.forEach(function (d) { html += "<div class='cal-dow'>" + d + "</div>"; });
        for (var i = 0; i < startDow; i++) html += "<div class='cal-cell empty'></div>";
        for (var d2 = 1; d2 <= daysInMonth; d2++) {
          var dateStr = mk.slice(0, 4) + "-" + mk.slice(4, 6) + "-" + ("0" + d2).slice(-2);
          var b = daily[dateStr];
          if (!b) { html += "<div class='cal-cell'><span class='d'>" + d2 + "</span></div>"; continue; }
          var net = b.payout - b.stake;
          var cls = net > 0 ? "win" : (net < 0 ? "lose" : "");
          var isBoundary = dateStr === A.NEW8_FROM;
          html += "<div class='cal-cell " + cls + "'" + (isBoundary ? " style='border:1px solid var(--gold)'" : "") + ">" +
            "<span class='d'>" + d2 + (isBoundary ? " <span style=\"color:var(--gold);font-size:8px\">初見〜</span>" : "") + "</span>" +
            "<span class='p'>" + (net === 0 ? "±0" : (net > 0 ? "+" : "") + Math.round(net / 1000) + "k") + "</span></div>";
        }
        html += "</div></div>";
      });
      return html;
    }

    // ===== タブ2: 場別・条件別 =====
    function venueTableRows(rows) {
      var mode = STATE.mode;
      var byName = {};
      rows.forEach(function (o) { byName[o.venue] = o.venue_name || o.venue; });
      var v = A.crossAgg(rows, function (o) { return o.venue; }, mode);
      return v.order.map(function (k) {
        var b = v.map[k];
        var j = A.judgeExp(v.mapE[k]);
        return {
          venue: k, venue_name: byName[k] || k, n: b.n, hits: b.hits, hitRate: pct(b.hits, b.n), recRate: pct(b.payout, b.stake),
          expRate: j ? j.expRate : null, judge: j ? j.judge : null, diff: j ? j.diff : null, nE: j ? j.nE : 0
        };
      });
    }

    function sortedVenueRows(rows) {
      var list = venueTableRows(rows);
      var col = STATE.sortVenue.col, dir = STATE.sortVenue.dir;
      list.sort(function (a, b) {
        var av = a[col], bv = b[col];
        if (typeof av === "string") return dir * (av < bv ? -1 : av > bv ? 1 : 0);
        return dir * (av - bv);
      });
      return list;
    }

    function sparse(n) { return n < 10 ? " sparse" : ""; }

    function expCellsHtml(mapE, k) {
      var j = mapE ? A.judgeExp(mapE[k]) : null;
      if (!j) return "<td class='num'>—</td><td class='num'>—</td><td class='num'>—</td>";
      return "<td class='num'>" + fmtPct(j.expRate) + "</td><td class='num'>" + esc(j.judge) + "（n=" + j.nE + "）</td><td class='num'>" + j.diff.toFixed(3) + "</td>";
    }

    function simpleCrossTable(title, sub, keyHead, keys, map, labelFn, mapE) {
      var h = "<section><h2>" + title + "</h2><p class='subhead'>" + sub + "</p><div class='table-scroll'><table><thead><tr>" +
        "<th>" + keyHead + "</th><th>レース数</th><th>的中率</th><th>回収率</th>" +
        (mapE ? "<th>想定回収率</th><th>判定</th><th>精度差</th>" : "") +
        "</tr></thead><tbody>";
      keys.forEach(function (k) {
        var b = map[k];
        if (!b) return;
        h += "<tr class='" + (b.n < 10 ? "sparse" : "") + "'><td>" + esc(labelFn ? labelFn(k) : k) + "</td>" +
          "<td class='num'>" + b.n + "</td><td class='num'>" + fmtPct(pct(b.hits, b.n)) + "</td>" +
          "<td class='num " + recClass(pct(b.payout, b.stake)) + "'>" + fmtPct(pct(b.payout, b.stake)) + "</td>" +
          (mapE ? expCellsHtml(mapE, k) : "") +
          "</tr>";
      });
      h += "</tbody></table></div><p class='footnote'>n&lt;10の行は参考値（文字を薄く表示）です。" +
        (mapE ? " 想定回収率・判定・精度差は ticket_probs/odds がある行のみの母集団（表の行数と異なる場合あり）。判定は想定払戻との差をz近似したもので、買い目間の相関を無視した参考値、n&lt;30は判定しない。精度差は logloss の差（モデル−市場、控除率25%仮定）、正の値はモデルの方が市場より当たらないことを示す。帯は多重比較になるため、標本が少ない帯・偶然の山に注意。" : "") +
        "</p></section>";
      return h;
    }

    function renderVenue(rows) {
      var html = "";
      html += "<section><h2>開催場別</h2><div class='table-scroll'><table><thead><tr>" +
        "<th class='sortable' data-sort='venue_name'>場 <span class='sort-icon'>▲▼</span></th>" +
        "<th class='sortable' data-sort='n'>レース数 <span class='sort-icon'>▲▼</span></th>" +
        "<th class='sortable' data-sort='hits'>的中数 <span class='sort-icon'>▲▼</span></th>" +
        "<th class='sortable' data-sort='hitRate'>的中率 <span class='sort-icon'>▲▼</span></th>" +
        "<th class='sortable' data-sort='recRate'>回収率 <span class='sort-icon'>▲▼</span></th>" +
        "<th>想定回収率</th><th>判定</th><th>精度差</th>" +
        "</tr></thead><tbody id='venue-tbody'></tbody></table></div><p class='footnote'>n&lt;10（レース数10未満）の行は参考値です。列見出しタップで並べ替え（想定回収率等は並べ替え未対応）。想定回収率・判定・精度差は ticket_probs/odds がある行のみの母集団。</p></section>";

      var mode = STATE.mode;
      var gradeAgg = A.crossAgg(rows, function (o) { return o.grade; }, mode);
      html += simpleCrossTable("級班別", "各行: レース数 / 的中率 / 回収率", "級班", A.GRADES, gradeAgg.map, function (k) { return A.GRADE_LABEL[k] || k; }, gradeAgg.mapE);

      var windAgg = A.crossAgg(rows, function (o) { return A.windBand(o.wind && o.wind.eff_speed); }, mode);
      html += simpleCrossTable("実効風速帯別", "実効風速 = 風速 × バンクβ（m/s）", "風", A.WIND_BANDS, windAgg.map, function (k) { return k + " m/s"; }, windAgg.mapE);

      var linesAgg = A.crossAgg(rows, function (o) { return A.linesKey(o.num_lines); }, mode);
      html += simpleCrossTable("ライン数別", "各行: レース数 / 的中率 / 回収率", "ライン", linesAgg.order.slice().sort(), linesAgg.map, function (k) { return k + "分戦"; }, linesAgg.mapE);

      var carsAgg = A.crossAgg(rows, function (o) { return Array.isArray(o.players) ? String(o.players.length) : null; }, mode);
      html += simpleCrossTable("車立て別", "players件数（車番総数）", "車立て", carsAgg.order.slice().sort(), carsAgg.map, function (k) { return k + "車立て"; }, carsAgg.mapE);

      var tierAgg = A.crossAgg(rows, function (o) { return o.tier; }, mode);
      html += simpleCrossTable("ティア別", "A/B/Cティア", "ティア", A.TIERS, tierAgg.map, null, tierAgg.mapE);

      var lenAgg = A.crossAgg(rows, function (o) { var b = A.bankFor(o.venue_name); return b ? A.lengthBand(b.length) : null; }, mode);
      html += simpleCrossTable("周回長別", "バンク情報なしの場はNR（表に出ません）", "周回長(m)", lenAgg.order.slice().sort(function (a, b) { return a - b; }), lenAgg.map, null, lenAgg.mapE);

      var strAgg = A.crossAgg(rows, function (o) { var b = A.bankFor(o.venue_name); return b ? A.straightBand(b.straight) : null; }, mode);
      html += simpleCrossTable("直線長別", "バンク情報なしの場はNR（表に出ません）", "直線長(m)", ["<52", "52-56", "56-60", "60+"], strAgg.map, null, strAgg.mapE);

      var cantoAgg = A.crossAgg(rows, function (o) { var b = A.bankFor(o.venue_name); return b ? A.cantoBand(b.canto) : null; }, mode);
      html += simpleCrossTable("カント角別", "バンク情報なしの場はNR（表に出ません）", "カント角(度)", ["<31", "31-32", "32-33", "33+"], cantoAgg.map, null, cantoAgg.mapE);

      var s1Agg = A.crossAgg(rows, function (o) { return A.s1Style(o); }, mode);
      html += simpleCrossTable("s1脚質別", "labelToCar.s1の車番のplayers[].style", "脚質", s1Agg.order.slice(), s1Agg.map, null, s1Agg.mapE);

      var kimariteAgg = A.simpleCross(rows, function (o) { return o.kimarite; });
      html += simpleCrossTable("決まり手別", "着1着を獲った決まり手", "決まり手", kimariteAgg.order.slice(), kimariteAgg.map);

      document.getElementById("panel-venue").innerHTML = html;
      renderVenueTbody(rows);

      document.querySelectorAll("#panel-venue th.sortable").forEach(function (th) {
        th.addEventListener("click", function () {
          var col = th.getAttribute("data-sort");
          if (STATE.sortVenue.col === col) STATE.sortVenue.dir *= -1;
          else { STATE.sortVenue.col = col; STATE.sortVenue.dir = 1; }
          renderVenueTbody(rows);
        });
      });
    }

    function renderVenueTbody(rows) {
      var list = sortedVenueRows(rows);
      var html = "";
      list.forEach(function (r) {
        html += "<tr class='" + (r.n < 10 ? "sparse" : "") + "'><td>" + esc(r.venue_name) + "</td>" +
          "<td class='num'>" + r.n + "</td><td class='num'>" + r.hits + "</td>" +
          "<td class='num'>" + fmtPct(r.hitRate) + "</td>" +
          "<td class='num " + recClass(r.recRate) + "'>" + fmtPct(r.recRate) + "</td>" +
          "<td class='num'>" + (r.expRate === null ? "—" : fmtPct(r.expRate)) + "</td>" +
          "<td class='num'>" + (r.judge === null ? "—" : esc(r.judge) + "（n=" + r.nE + "）") + "</td>" +
          "<td class='num'>" + (r.diff === null ? "—" : r.diff.toFixed(3)) + "</td></tr>";
      });
      document.getElementById("venue-tbody").innerHTML = html;
    }

    // ===== タブ3: 検証 =====
    var MISS_LABEL = { ana: "穴", oshii: "惜しい", atamachigai: "頭違い", himonuke: "ヒモ抜け" };
    var LABEL_NAME = { s1: "s1(A)", s2: "s2(B)", s3: "s3(C)", L: "L", o1: "o1" };

    function renderKensho(rows) {
      var html = "";
      var mode = STATE.mode;
      var abc = A.abcDist(rows);
      html += "<section><h2>A/B/C着順分布</h2><p class='subhead'>s1(A)・s2(B)・s3(C)・L が着順のどこに入ったか</p><div class='table-scroll'><table><thead><tr>" +
        "<th>ラベル</th><th>1着</th><th>2着</th><th>3着</th><th>圏外</th><th>n</th></tr></thead><tbody>";
      A.LABELS.forEach(function (l) {
        var d = abc[l];
        html += "<tr><td>" + LABEL_NAME[l] + "</td><td class='num'>" + fmtPct(pct(d[1], d.n)) + "</td>" +
          "<td class='num'>" + fmtPct(pct(d[2], d.n)) + "</td><td class='num'>" + fmtPct(pct(d[3], d.n)) + "</td>" +
          "<td class='num'>" + fmtPct(pct(d.other, d.n)) + "</td><td class='num'>" + d.n + "</td></tr>";
      });
      html += "</tbody></table></div></section>";

      var miss = A.missClassify(rows, mode);
      var missKeys = ["ana", "oshii", "atamachigai", "himonuke"];
      var missTotal = missKeys.reduce(function (sum, k) { return sum + miss.counts[k]; }, 0);
      html += "<section><h2>外れ方の分類（不的中レースのみ）</h2><div class='table-scroll'><table><thead><tr><th>分類</th><th>件数</th><th>割合</th></tr></thead><tbody>";
      missKeys.forEach(function (k) {
        html += "<tr><td>" + MISS_LABEL[k] + "</td><td class='num'>" + miss.counts[k] + "</td><td class='num'>" + fmtPct(pct(miss.counts[k], missTotal)) + "</td></tr>";
      });
      html += "</tbody></table></div><p class='footnote'>判定は上から順に排他的: 「穴」=1着が s1/s2/s3/L のいずれでもない。「惜しい」=三連単の買い目に finish と2着分以上順番込みで合致するものがある。「頭違い」=1着が s1 の車ではない。「ヒモ抜け」=それ以外（1着は s1 だが買い目に無い）。" + (mode === "odds" ? "オッズ加味では、買わなかった買い目は存在しないものとして扱う（惜しい判定も買った買い目のみ。対象はオッズ加味で不的中だった行、買える買い目が0のレースは除く）。" : "") + "</p></section>";

      var ep = A.ticketsMeasured(rows, mode);
      var epOverallN = ep.overallN, epOverallHit = ep.overallHitRows, perRecalc = ep.per;
      var hasRef = rows.some(function (o) { return o.retro; });

      html += "<section><h2>新8点それぞれの実測</h2><p class='subhead'>全行を新8点で再精算した結果" + (hasRef ? "（" + dateMinusOne(A.NEW8_FROM) + " 以前は後付け当てはめ・" + A.NEW8_FROM + "〜は初見）" : "") + "</p>";
      html += "<div class='summary'><div class='stat'><div class='label'>全体的中率</div><div class='value num'>" + fmtPct(pct(epOverallHit, epOverallN)) + "</div><div class='sub'>" + epOverallHit + " / " + epOverallN + "（参考値: 過去1,457R検証で27.2%）</div></div></div>";
      html += "<div class='table-scroll'><table><thead><tr><th>買い目</th><th>的中数</th><th>払戻合計</th><th>回収率</th></tr></thead><tbody>";
      A.NEW8_TICKETS.forEach(function (t) {
        var p = perRecalc[t.key];
        html += "<tr><td>" + (t.type === "nisyatan" ? "2単 " : "3単 ") + t.key + "</td><td class='num'>" + p.hits + "</td>" +
          "<td class='num'>" + fmtYen(p.payout) + "</td><td class='num " + recClass(pct(p.payout, p.n * 100)) + "'>" + fmtPct(pct(p.payout, p.n * 100)) + "</td></tr>";
      });
      html += "</tbody></table></div>" + (mode === "odds" ? "<p class='footnote'>オッズ加味＝その買い目の確定オッズ×的中確率≧1 だった行のみを集計（n=買えた回数）。</p>" : "") + "</section>";

      document.getElementById("panel-kensho").innerHTML = html;
    }

    // ===== タブ4: 記録 =====
    function renderKiroku(rows) {
      var dates = Array.from(new Set(rows.map(function (o) { return o.date; }))).sort().reverse();
      var venues = Array.from(new Set(rows.map(function (o) { return o.venue_name || o.venue; }))).sort();
      var html = "<section><h2>全件（新しい順）</h2>";
      html += "<div class='record-filters'>";
      html += "<select id='rf-date'><option value=''>日付:全て</option>" + dates.map(function (d) { return "<option value='" + esc(d) + "'" + (STATE.recFilter.date === d ? " selected" : "") + ">" + esc(d) + "</option>"; }).join("") + "</select>";
      html += "<select id='rf-venue'><option value=''>場:全て</option>" + venues.map(function (v) { return "<option value='" + esc(v) + "'" + (STATE.recFilter.venue === v ? " selected" : "") + ">" + esc(v) + "</option>"; }).join("") + "</select>";
      html += "<select id='rf-grade'><option value=''>級別:全て</option>" + A.GRADES.map(function (g) { return "<option value='" + g + "'" + (STATE.recFilter.grade === g ? " selected" : "") + ">" + A.GRADE_LABEL[g] + "</option>"; }).join("") + "</select>";
      html += "<select id='rf-hit'><option value=''>的中:全て</option><option value='y'" + (STATE.recFilter.hit === "y" ? " selected" : "") + ">的中のみ</option><option value='n'" + (STATE.recFilter.hit === "n" ? " selected" : "") + ">不的中のみ</option></select>";
      html += "</div>";
      if (STATE.mode === "odds") {
        html += "<p class='footnote'>オッズ加味：確定オッズが必要倍率以上の買い目だけ買った場合。買った点数はレースごとに違い、投資額・的中率・回収率の母数もそれに連動する。的中率＝買ったレースのうち1点でも当たったレースの割合。</p>";
      }
      html += "<div class='table-scroll'><table class='detail recent'><thead><tr>" +
        "<th>日付</th><th>場</th><th>R</th><th>級別</th><th>風</th><th>確定着順</th><th>決まり手</th><th>的中券種</th><th>払戻</th>" +
        (STATE.mode === "odds" ? "<th>買った点／投資</th>" : "") +
        "<th>的中</th></tr></thead><tbody id='kiroku-tbody'></tbody></table></div></section>";

      var hl = A.highlights(rows, STATE.mode);
      html += "<section><h2>名場面</h2><h3 style='font-size:12px;color:var(--text-dim);margin:0 0 6px'>高配当的中 Top10</h3><ul class='highlight-list'>";
      hl.bigHits.forEach(function (x) {
        html += "<li><span class='hl-main'>" + esc(x.o.date) + " " + esc(x.o.venue_name || x.o.venue) + " " + x.o.race + "R（" + esc(x.o.finish.join("-")) + "）</span><span class='num hit-y'>" + fmtYen(x.s.payout) + "</span></li>";
      });
      html += "</ul><h3 style='font-size:12px;color:var(--text-dim);margin:14px 0 6px'>惜敗 Top10（惜しい分類）</h3><ul class='highlight-list'>";
      hl.oshii.forEach(function (x) {
        html += "<li><span class='hl-main'>" + esc(x.o.date) + " " + esc(x.o.venue_name || x.o.venue) + " " + x.o.race + "R（" + esc(x.o.finish.join("-")) + "）</span><span class='num'>" + fmtYen(x.o.payouts.sanrentan || 0) + "（見送り配当）</span></li>";
      });
      html += "</ul></section>";

      document.getElementById("panel-kiroku").innerHTML = html;
      renderKirokuTbody(rows);

      ["rf-date", "rf-venue", "rf-grade", "rf-hit"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", function (e) {
          var key = id.slice(3);
          STATE.recFilter[key] = e.target.value;
          renderKirokuTbody(rows);
        });
      });
    }

    function betSummaryHtml(o, s, mode) {
      var f = o.finish;
      var hitTicket = null, hitIdx = -1;
      for (var i = 0; i < o.tickets.length; i++) {
        var t = o.tickets[i], c = t.cars;
        var win = t.type === "sanrentan" ? (c[0] === f[0] && c[1] === f[1] && c[2] === f[2]) : (c[0] === f[0] && c[1] === f[1]);
        if (win) { hitTicket = t; hitIdx = i; break; }
      }
      if (!hitTicket) return "—";
      if (mode === "odds") {
        var bi = A.boughtInfo(o);
        if (bi && !bi[hitIdx].bought) {
          return "買えず " + (hitTicket.type === "sanrentan" ? "3単 " : "2単 ") + esc(hitTicket.cars.join("-")) +
            "（" + bi[hitIdx].odds.toFixed(1) + "倍<必要" + bi[hitIdx].need.toFixed(1) + "倍）";
        }
      }
      return (hitTicket.type === "sanrentan" ? "3単 " : "2単 ") + esc(hitTicket.cars.join("-"));
    }

    function renderKirokuTbody(rows) {
      var mode = STATE.mode;
      var f = STATE.recFilter;
      var filtered = rows.filter(function (o) {
        if (f.date && o.date !== f.date) return false;
        if (f.venue && (o.venue_name || o.venue) !== f.venue) return false;
        if (f.grade && o.grade !== f.grade) return false;
        var sRaw = A.modeSettle(o, mode);
        var skippedBuy = (mode === "odds" && (sRaw === null || sRaw.bought === 0));
        var hit = skippedBuy ? false : sRaw.hit;
        if (f.hit === "y" && !hit) return false;
        if (f.hit === "n" && (hit || skippedBuy)) return false;
        return true;
      });
      filtered.sort(function (a, b) { var x = a.date + (a.start_time || ""), y = b.date + (b.start_time || ""); return x < y ? 1 : x > y ? -1 : 0; });
      var html = "";
      filtered.forEach(function (o, i) {
        var sRaw = A.modeSettle(o, mode);
        var skippedBuy = (mode === "odds" && (sRaw === null || sRaw.bought === 0));
        var s = skippedBuy ? null : sRaw;
        html += "<tr class='rt-row' data-rt='k" + i + "'>" +
          "<td>" + esc(o.date) + (o.retro ? " <span style='font-size:10px;color:var(--text-dim);border:1px solid var(--border);border-radius:3px;padding:0 3px'>後付</span>" : "") + "</td><td>" + esc(o.venue_name || o.venue) + "</td><td class='num'>" + o.race + "R</td>" +
          "<td>" + esc(A.GRADE_LABEL[o.grade] || o.grade || "") + "</td>" +
          "<td>" + esc((o.wind && o.wind.direction) || "") + " " + ((o.wind && typeof o.wind.eff_speed === "number") ? o.wind.eff_speed.toFixed(1) : "") + "</td>" +
          "<td class='num'>" + esc(o.finish.join("-")) + "</td><td>" + esc(o.kimarite || "") + "</td>" +
          "<td>" + betSummaryHtml(o, s, mode) + "</td>" +
          "<td class='num'>" + (skippedBuy ? "—" : (s.hit ? fmtYen(s.payout) : "—")) + "</td>" +
          (mode === "odds" ? "<td class='num'>" + (skippedBuy ? "見送り" : (s.bought + "点・" + fmtYen(s.stake))) + "</td>" : "") +
          "<td class='" + (skippedBuy ? "" : (s.hit ? "hit-y" : "hit-n")) + "'>" + (skippedBuy ? "見送り(買えず)" : (s.hit ? "○" : "✕")) + "</td></tr>";
        var bi = (mode === "odds") ? A.boughtInfo(o) : null;
        var betsHtml = o.tickets.map(function (t, ti) {
          var c = t.cars;
          var win = t.type === "sanrentan" ? (c[0] === o.finish[0] && c[1] === o.finish[1] && c[2] === o.finish[2]) : (c[0] === o.finish[0] && c[1] === o.finish[1]);
          var info = bi ? bi[ti] : null;
          var notBought = !!(info && !info.bought);
          var cls = "bet num" + (win && !notBought ? " bet-hit" : "");
          var style = notBought ? " style='opacity:.4'" : "";
          var suffix = notBought ? (win ? " (当たり・買えず)" : " (買えず)") : "";
          return "<span class='" + cls + "'" + style + ">" + (t.type === "nisyatan" ? "2単 " : "3単 ") + esc(c.join("-")) + suffix + "</span>";
        }).join("");
        html += "<tr class='rt-detail' id='rt-detail-k" + i + "' hidden><td colspan='" + (mode === "odds" ? 11 : 10) + "'><div class='race-detail'>" +
          "<div class='rd-row'>買い目（三連単6点＋二車単2点）:</div><div class='bet-grid'>" + betsHtml + "</div>" +
          (skippedBuy
            ? "<div class='rd-row'>投資 <span class='num'>—</span> ／ 払戻 <span class='num'>—</span> ／ 回収 <span class='num'>見送り(買えず)</span></div>"
            : "<div class='rd-row'>投資 <span class='num'>" + fmtYen(s.stake) + "</span> ／ 払戻 <span class='num'>" + fmtYen(s.payout) + "</span> ／ 回収 <span class='num " + (pct(s.payout, s.stake) >= 100 ? "hit-y" : "hit-n") + "'>" + fmtPct(pct(s.payout, s.stake)) + "</span></div>") +
          "</div></td></tr>";
      });
      document.getElementById("kiroku-tbody").innerHTML = html;
      document.querySelectorAll("#kiroku-tbody tr.rt-row").forEach(function (row) {
        row.addEventListener("click", function () {
          var el = document.getElementById("rt-detail-" + row.getAttribute("data-rt"));
          if (el) el.hidden = !el.hidden;
        });
      });
    }

    // ===== 全体描画 =====
    function renderAll() {
      var skippedCounter = { n: 0 };
      var rows = A.filterRows(STATE.records, A.LIVE_FROM, false, skippedCounter);
      STATE.skippedCount = skippedCounter.n;
      document.getElementById("app").innerHTML = shellHtml();
      document.querySelectorAll(".mode-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          STATE.mode = btn.getAttribute("data-mode");
          renderAll();
        });
      });
      document.querySelectorAll("#tabbar .tab-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          STATE.tab = btn.getAttribute("data-tab");
          document.querySelectorAll("#tabbar .tab-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
          document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
          document.getElementById("panel-" + STATE.tab).classList.add("active");
        });
      });
      renderSeiseki(rows);
      renderVenue(rows);
      renderKensho(rows);
      renderKiroku(rows);
    }

    if (!A.LIVE_FROM) {
      document.getElementById("app").innerHTML = "<div class='loading'>稼働開始前です。</div>";
      return;
    }
    fetchAll().then(function (records) {
      STATE.records = records;
      var rows = A.filterRows(records, A.LIVE_FROM, false, { n: 0 });
      if (!rows.length) { document.getElementById("app").innerHTML = "<div class='loading'>稼働開始前です（精算済みのレースがまだありません）。</div>"; return; }
      renderAll();
    }).catch(function (e) {
      document.getElementById("app").innerHTML = "<div class='error'>集計に失敗しました: " + esc(e.message) + "</div>";
    });
  })();
</script>
</body>
</html>
